name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: unzip beytuweb-project.zip && ls -la
      - name: Find gradlew
        run: find . -name "gradlew" -type f
      - name: Build APK
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          DIR=$(dirname $GRADLEW)
          chmod +x $GRADLEW
          cd $DIR && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Beytuweb-APK
          path: "**/app-debug.apk"
